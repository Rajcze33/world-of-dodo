<!doctype html>
<!--
  World of DODO: the multiplayer arena built on Poslední míle (The Last Mile), DODO's Christmas 2026
  game, in a version where the delivery van had already become a tank. Served by server/server.js,
  which also relays the players and drives the bots. How it all fits together: README.md and
  docs/PROTOCOL.md.

  What changed against the original: no shift, no stops, no clock, no REDLINE hunt and no police.
  The player joins with a name and a tank colour; the other players and the server's bots drive in
  the same city with their names glowing above them; parcels hit other tanks (10 points for a
  player, 1 for a bot), three hits destroy a tank and it comes back somewhere else. The network part
  is the "WORLD OF DODO" section near the end of the script; smaller changes are marked
  "World of DODO" where they are. The shift code of the original (deliveries, handover, the GAIA
  finale, results) is still in the script but never runs; its screens were removed from the page.
  Czech by default, English with ?lang=en.
-->
<html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><link rel="icon" href="/assets/icon.svg" type="image/svg+xml"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>World of DODO</title>
<style>
/* The game's fonts, copied from the DODO web (apps/web/public/dodo-christmas/fonts).
   The weights the handoff requested: Poppins 300/400/600/700, IBM Plex Mono 400/500/600. */
@font-face{font-family:"Poppins";font-weight:300;font-style:normal;font-display:swap;src:url("/fonts/Poppins-Light.ttf") format("truetype")}
@font-face{font-family:"Poppins";font-weight:400;font-style:normal;font-display:swap;src:url("/fonts/Poppins-Regular.ttf") format("truetype")}
@font-face{font-family:"Poppins";font-weight:600;font-style:normal;font-display:swap;src:url("/fonts/Poppins-SemiBold.ttf") format("truetype")}
@font-face{font-family:"Poppins";font-weight:700;font-style:normal;font-display:swap;src:url("/fonts/Poppins-Bold.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url("/fonts/IBMPlexMono-Regular.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url("/fonts/IBMPlexMono-Medium.ttf") format("truetype")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:swap;src:url("/fonts/IBMPlexMono-SemiBold.ttf") format("truetype")}
</style>
<style>
/* Layout: full-bleed 3D city; HUD pinned to the corners on solid charcoal cards; intro and results sit on the Hero scrim */
:root{
  --dodo-green:#27a28c; --dodo-dark-teal:#00746a; --dodo-charcoal:#3d4543; --dodo-light-teal:#b2dcd6;
  --dodo-peach:#f9aa8f; --dodo-white:#ffffff; --dodo-light-grey:#eaebeb; --dodo-grey:#adb1b0;
  --dodo-charcoal-80:#555c5a; --dodo-ink:#000000;
  --cta-bg:#f9aa8f; --cta-bg-hover:#f59a7b; --cta-bg-pressed:#ec8a6a;
  --gradient-hero-stops:#1e2322 11%, rgba(0,58,52,.72) 64%, rgba(0,58,52,0) 92%;
  --font-primary:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-secondary:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs-h1:56px; --fs-h2:40px; --fs-h3:28px; --fs-h4:22px; --fs-body-lg:18px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:12px; --fs-overline:11px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --radius-16:16px; --radius-pill:999px;
  --ease:cubic-bezier(0.2,0,0,1);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--dodo-ink);color:var(--dodo-white);font-family:var(--font-primary);font-size:var(--fs-body);overflow:hidden;font-feature-settings:"ss03" 1;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mono{font-family:var(--font-secondary);text-transform:uppercase;letter-spacing:.14em;font-size:var(--fs-overline);font-weight:600}
.meta{font-family:var(--font-secondary);text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-caption);font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"ss03" 1,"tnum" 1}
.card{background:var(--dodo-charcoal);border:1px solid var(--dodo-charcoal-80);border-radius:var(--radius-16)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
.tl{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:var(--space-3);width:240px}
.status{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.status img{height:20px;width:auto;align-self:flex-start}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3)}
.clock{font-size:var(--fs-h3);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.status .mono{color:var(--dodo-light-teal)}
#stops{list-style:none;margin:0;padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
#stops li{display:flex;align-items:center;gap:var(--space-3);font-size:var(--fs-body-sm);color:var(--dodo-white)}
#stops li .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--dodo-green);color:var(--dodo-white);display:grid;place-items:center;font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:600}
#stops li.done{color:var(--dodo-grey)}
#stops li.done .n{background:transparent;border:1px solid var(--dodo-grey);color:var(--dodo-grey)}
#stops li.done .nm{text-decoration:line-through}
#stops li .t{margin-left:auto;color:var(--dodo-grey)}
.tr{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-3)}
#mini{display:block;width:176px;height:176px;border-radius:var(--radius-16);border:1px solid var(--dodo-charcoal-80);background:var(--dodo-charcoal)}
.camBtn{pointer-events:auto;display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-pill);border:1px solid var(--dodo-grey);background:var(--dodo-charcoal);color:var(--dodo-white);font:500 var(--fs-body-sm) var(--font-primary);cursor:pointer}
.camBtn:hover{border-color:var(--dodo-white)}
.camBtn:focus-visible,.cta:focus-visible,.tbtn:focus-visible{outline:2px solid var(--dodo-light-teal);outline-offset:2px}
.bc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.gauge{display:flex;gap:var(--space-5);padding:var(--space-3) var(--space-5);align-items:baseline}
.gauge b{font-size:var(--fs-h4);font-weight:600;font-variant-numeric:tabular-nums}
.gauge span{color:var(--dodo-grey)}
#toast{padding:var(--space-3) var(--space-5);border-radius:var(--radius-pill);background:var(--dodo-white);color:var(--dodo-charcoal);font-size:var(--fs-body-sm);font-weight:600;white-space:nowrap;transition:opacity 220ms var(--ease),transform 220ms var(--ease)}
#toast.off{opacity:0;transform:translateY(8px)}
#pod{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:280px;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);transition:opacity 220ms var(--ease),transform 220ms var(--ease)}
#pod.off{opacity:0;transform:translateY(16px)}
#pod .ok{display:flex;align-items:center;gap:var(--space-2);color:var(--dodo-light-teal)}
#pod .ok svg{width:16px;height:16px}
#pod h4{margin:0;font-size:var(--fs-h4);font-weight:600;line-height:1.2}
#pod p{margin:0;font-size:var(--fs-body-sm);color:var(--dodo-light-grey)}
#sig{width:100%;height:72px;border-radius:var(--radius-16);background:var(--dodo-light-grey);display:block}
#pod .checks{display:flex;gap:var(--space-4);color:var(--dodo-grey)}
#pod .checks span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dodo-green);margin-right:6px;vertical-align:middle}

/* honey jars */
.jars-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.jars-row .meta{color:var(--dodo-light-grey);white-space:nowrap}
.jars{display:flex;gap:var(--space-2)}
.jar{width:20px;height:26px;display:block;overflow:visible}
.jar .honey{transform:translateY(19px);transition:transform 700ms var(--ease)}
.jar.full .honey{transform:translateY(0)}
.jar.pop{animation:pop 700ms var(--ease)}
@keyframes pop{0%{transform:translateY(0)}35%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.jars.big{gap:var(--space-3)}
.jars.big .jar{width:30px;height:39px}

/* finale */
#finale{position:fixed;inset:0;pointer-events:none}
#finale[hidden]{display:none!important}
.fin-card{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:var(--space-6);padding:var(--space-4) var(--space-5);max-width:calc(100% - 32px)}
.fin-text{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fin-text .overline{color:var(--dodo-green)}
.fin-line{margin:0;font-size:var(--fs-body);font-weight:600}
.fin-km b{font-size:var(--fs-h3);font-weight:700;font-variant-numeric:tabular-nums}
.fin-km .meta{color:var(--dodo-grey)}
.skip{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:760px){.fin-card{gap:var(--space-4);width:calc(100% - 32px)}.fin-line{font-size:var(--fs-body-sm)}.jar{width:14px;height:18px}}

/* touch */
#touch{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
#touch .grp{display:flex;gap:var(--space-3);pointer-events:auto}
.tbtn{width:64px;height:64px;border-radius:50%;border:1px solid var(--dodo-grey);background:var(--dodo-charcoal);color:var(--dodo-white);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtn svg{width:28px;height:28px}
.tbtn.on{background:var(--dodo-charcoal-80);border-color:var(--dodo-white)}
.tbtn.gas{background:var(--dodo-white);color:var(--dodo-charcoal);border-color:var(--dodo-white)}
.tbtn.gas.on{background:var(--dodo-light-grey)}
.tbtn.fire{position:absolute;right:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));pointer-events:auto;background:var(--dodo-green);border-color:var(--dodo-light-teal);color:var(--dodo-white)}
.tbtn.fire.on{background:var(--dodo-dark-teal)}

/* overlays */
.overlay{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(90deg,var(--gradient-hero-stops));display:flex;align-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) clamp(20px,4vw,48px) calc(48px + env(safe-area-inset-bottom,0px))}
.overlay[hidden]{display:none!important}
.intro-inner{max-width:560px;display:flex;flex-direction:column;gap:var(--space-5)}
.intro-inner img{height:32px;width:auto;align-self:flex-start}
.overline{font-family:var(--font-secondary);text-transform:uppercase;letter-spacing:.14em;font-size:var(--fs-overline);font-weight:600;color:var(--dodo-light-teal);margin:0}
h1{font-size:var(--fs-h1);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:var(--fs-h2);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:var(--fs-body-lg);font-weight:300;line-height:1.6;margin:0;color:var(--dodo-white);max-width:52ch}
.keys{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);color:var(--dodo-light-grey)}
.keys kbd{font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:500;border:1px solid var(--dodo-grey);border-radius:var(--radius-pill);padding:2px 8px;margin-right:6px;color:var(--dodo-white)}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--space-2);background:var(--cta-bg);color:var(--dodo-charcoal);border:0;border-radius:var(--radius-pill);padding:var(--space-3) var(--space-6);font:400 var(--fs-body) var(--font-primary);cursor:pointer;transition:background 120ms var(--ease)}
.cta:hover{background:var(--cta-bg-hover)}
.cta:active{background:var(--cta-bg-pressed);transform:translateY(1px)}
.cta svg{width:18px;height:18px}
.cta[disabled]{opacity:.6;cursor:progress}
.fine{color:var(--dodo-grey);font-size:var(--fs-caption);margin:0}

.res-inner{width:100%;max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:var(--space-7);align-items:center}
.res-text{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.kpi{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.kpi .v{font-size:var(--fs-h3);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.main{border-color:var(--dodo-green)}.kpi.main .v{color:var(--dodo-light-teal)}
.kpi .mono{color:var(--dodo-light-grey)}
.order{display:flex;flex-direction:column;gap:var(--space-2)}
.order .row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.order .lbl{width:96px;color:var(--dodo-light-grey)}
.dot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:600}
.dot.you{border:1px solid var(--dodo-light-teal);color:var(--dodo-light-teal)}
.dot.gaia{background:var(--dodo-green);color:var(--dodo-white)}
.mapwrap{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
#resmap{width:100%;aspect-ratio:1/1;max-width:100%;display:block;border-radius:var(--radius-16)}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;color:var(--dodo-light-grey)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.wish{font-size:var(--fs-body);line-height:1.6;margin:0;color:var(--dodo-white);max-width:56ch}

@media (max-width:760px){
  :root{--fs-h1:40px;--fs-h2:28px;--fs-h3:22px}
  .overlay{background:linear-gradient(0deg,var(--gradient-hero-stops));align-items:flex-end}
  #results.overlay{background:#1e2322;align-items:flex-start}
  .res-inner{grid-template-columns:minmax(0,1fr);gap:var(--space-5)}
  .tl{width:auto;right:calc(16px + 136px)}
  #stops{display:none}
  .status{padding:var(--space-3)}
  .clock{font-size:var(--fs-h4)}
  #mini{width:120px;height:120px}
  .tr .camBtn{padding:var(--space-1) var(--space-3)}
  .bc{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #pod{left:16px;right:16px;width:auto;bottom:calc(180px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* time windows */
.status-top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.status-top img{height:20px;width:auto}
.wins{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.wins:empty{display:none}
.win{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:var(--radius-pill);background:var(--dodo-white);color:var(--dodo-charcoal);font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.win b{width:18px;height:18px;border-radius:50%;background:var(--dodo-green);color:var(--dodo-white);display:grid;place-items:center;font-weight:600}
.win.ok{background:transparent;color:var(--dodo-grey);border:1px solid var(--dodo-grey);text-decoration:line-through}
.win.ok b{background:var(--dodo-grey)}
.win.late b{background:#c0524a}
#stops li .t.w{color:var(--dodo-white)}
#stops li .t{white-space:nowrap}
#stops li .nm{min-width:0}
@media (min-width:761px){.tl{width:300px}}
p.keys{margin:0}

/* steering pad */
#touch{align-items:flex-end}
.steer{position:relative;width:min(184px,46vw);height:72px;border-radius:var(--radius-pill);border:1px solid var(--dodo-grey);background:var(--dodo-charcoal);touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
.steer .ar{position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--dodo-grey)}
.steer .ar.l{left:12px}.steer .ar.r{right:12px}
.steer .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--dodo-white);transition:transform 120ms var(--ease)}
.steer.on .knob{transition:none}
.tbtn{width:72px;height:72px}

/* logos */
.logos{display:flex;align-items:center;gap:var(--space-3)}
.brand-row{display:flex;align-items:center;gap:var(--space-4)}
.brand-row img{height:32px;width:auto}
/* plan screen */
.start-time{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5);align-self:flex-start;border-color:var(--dodo-green)}
.start-time svg{width:40px;height:40px;flex:none;color:var(--dodo-green)}
.st-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-txt .mono{color:var(--dodo-light-teal)}
.st-txt b{font-size:var(--fs-h2);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st-txt small{font-size:var(--fs-caption);color:var(--dodo-light-grey)}
.plan-inner{width:100%;max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);grid-template-areas:"head map" "side map";gap:var(--space-5) var(--space-7);align-items:start}
.plan-head{grid-area:head;display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.plan-map{grid-area:map}
.plan-side{grid-area:side;display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
#planmap{width:100%;aspect-ratio:1/1;max-width:100%;display:block;border-radius:var(--radius-16)}
.legend i.dep{width:12px;height:12px;border-radius:50%;background:var(--dodo-light-teal)}
.legend i.slot{width:20px;height:10px;border-radius:var(--radius-pill);background:var(--dodo-white)}
.plan-list{list-style:none;margin:0;padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.plan-list li{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.plan-list .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--dodo-green);color:var(--dodo-white);display:grid;place-items:center;font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:600}
.plan-list .nm{display:flex;flex-direction:column;min-width:0;font-size:var(--fs-body-sm);font-weight:600}
.plan-list .nm small{font-weight:400;color:var(--dodo-light-grey);font-size:var(--fs-caption)}
.plan-list .win{margin-left:auto;padding:2px 10px}
#mini{pointer-events:auto;cursor:pointer}
#mini.big{width:min(340px,calc(100vw - 32px));height:min(340px,calc(100vw - 32px))}
@media (max-width:760px){
  #plan.overlay{background:#1e2322;align-items:flex-start}
  .plan-inner{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "map" "side";gap:var(--space-4)}
  .plan-head{gap:var(--space-3)}
  .plan-head .lead{font-size:var(--fs-body)}
  #goBtn{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));align-self:stretch;justify-content:center}
}

/* mobile-first overrides */
html,body{overscroll-behavior:none}
body{touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.overlay{touch-action:pan-y}
#hud,#touch,#finale{user-select:none;-webkit-user-select:none}
@media (max-width:760px),(pointer:coarse) and (max-width:1024px){
  .tl{width:auto;right:calc(16px + 112px + 12px + env(safe-area-inset-right,0px));gap:var(--space-2)}
  #stops{display:none}
  .status{padding:var(--space-3);gap:var(--space-2)}
  .status-top img{height:16px}

// A prop is a solid circle (r) while it stands. A vehicle that hits it with enough impact speed (>= breakV; trees also need a heavy

function netHit(s,kill){netSend({t:'hit',by:s.by,sid:s.sid,kill});}
// every frame: send this tank now and then, draw the others between their two snapshots around NET_DELAY ago
function netUpdate(dt,tnow){
  if(state==='drive'&&NET.live){NET.sendT-=dt;if(NET.sendT<=0){NET.sendT=NET_SEND;
    netSend({t:'st',x:r2(car.x),z:r2(car.z),h:Math.round(car.h*1000)/1000,v:r2(car.v),r:r2(car.roll),s:car.immT>0?1:0});}}
  if(NET.live&&tnow-(NET.pingAt||0)>2000){NET.pingAt=tnow;netSend({t:'ping',c:Math.round(tnow)});}   // the ping in the performance readout
  const rt=tnow-NET_DELAY;
  for(const o of NET.others.values()){const b=o.buf;if(!b.length)continue;
    while(b.length>2&&b[1].t<=rt)b.shift();
    const a=b[0],c=b[1]||a,jump=Math.hypot(c.x-a.x,c.z-a.z)>20;                                         // a respawn: no sliding across the city
    const k=jump?(rt>=c.t?1:0):c.t>a.t?Math.max(0,Math.min(1,(rt-a.t)/(c.t-a.t))):1;
    o.x=lerp(a.x,c.x,k);o.z=lerp(a.z,c.z,k);o.h=angLerp(a.h,c.h,k);o.v=lerp(a.v,c.v,k);o.r=lerp(a.r,c.r,k);o.hx=Math.sin(o.h);o.hz=Math.cos(o.h);
    o.s=(k<0.5?a:c).s;
    o.on=true;
    o.g.visible=!(o.s&&Math.floor(tnow/110)%2);                                                           // blinks while immune after a (re)spawn
    const gy=groundH(o.x,o.z);o.g.position.set(o.x,gy+0.9*Math.abs(Math.sin(o.r)),o.z);o.g.rotation.y=o.h;o.g.rotation.z=o.r;
    o.g.userData.wheels.forEach(w=>w.rotation.x+=o.v*dt/0.46);
    // spotted: in plain sight of the camera (no building in between, not lost in the fog); checked ten times a second
    if(tnow-(o.losAt||0)>100){o.losAt=tnow;o.seen=inSight(o.x,gy+1.3,o.z)||inSight(o.x,gy+2.6,o.z);}
    if(o.seen){o.seenAt=tnow;o.seenX=o.x;o.seenZ=o.z;}
    o.tag.visible=o.seen;o.tag.position.set(o.x,gy+3.2,o.z);}}
// the first building or site obstacle (SOLIDS: boxes standing on the ground) on the segment from a to b, as 0..1 along it; 1 if none
function segHit(ax,ay,az,bx,by,bz){const dx=bx-ax,dy=by-ay,dz=bz-az;let best=1;
  for(const b of SOLIDS){let t0=0,t1=best,hit=true;
    for(const[p,d,lo,hi]of[[ax,dx,b.x0,b.x1],[ay,dy,0,b.h],[az,dz,b.z0,b.z1]]){
      if(Math.abs(d)<1e-9){if(p<lo||p>hi){hit=false;break;}continue;}
      let u=(lo-p)/d,v=(hi-p)/d;if(u>v){const w=u;u=v;v=w;}t0=Math.max(t0,u);t1=Math.min(t1,v);if(t0>t1){hit=false;break;}}
    if(hit)best=t0;}
  return best;}
// can the camera see the point (x,y,z)? no obstacle in between, within the fog's reach
const SIGHT_MAX=230,SPOT_MS=3000;                       // farther is fog; a spotted tank stays on the minimap this long after it went out of sight
function inSight(x,y,z){const c=camera.position;if((x-c.x)**2+(z-c.z)**2>SIGHT_MAX*SIGHT_MAX)return false;return segHit(c.x,c.y,c.z,x,y,z)>=1;}
// the scoreboard: the best five, and you below them if you are not among them; ties share a rank; bots are listed too
function renderBoard(){
  const all=[{name:NET.name,color:NET.color,pts:NET.pts,me:true}].concat([...NET.others.values()]);
  all.sort((a,b)=>b.pts-a.pts||!!a.bot-!!b.bot||a.name.localeCompare(b.name,T.lang));
  const rows=all.slice(0,5),mine=all.find(p=>p.me);if(!rows.includes(mine))rows.push(mine);
  const el=$('board');el.innerHTML='';
  for(const p of rows){const li=document.createElement('li');li.className=p.me?'me':p.bot?'bot':'';
    li.innerHTML='<span class="rk meta"></span><i></i><span class="nm"></span><b class="meta"></b>';
    li.querySelector('.rk').textContent=1+all.filter(q=>q.pts>p.pts).length;li.querySelector('i').style.background=hexCss(p.color);
    li.querySelector('.nm').textContent=p.name;li.querySelector('b').textContent=p.pts;el.appendChild(li);}
  $('online').textContent=T.online(all.filter(p=>!p.bot).length);$('myPts').textContent=NET.pts;}
function joinErr(msg){const e=$('joinErr');e.textContent=msg;e.hidden=!msg;}

// ---------- WORLD OF DODO: the shared city ----------
// Once you play, the cars, the tram and the pedestrians come from the server (server/world.js), which moves them for everyone; the
// browser only draws them between two snapshots (about 7 a second) WORLD_DELAY ms behind. Cars are solid: a tank bounces off them.
// A pedestrian your tank or your own parcel hits is reported, and falls (for everyone) when the server says so. A tree or a lamp you
// knock down falls here at once and is passed on to the others. Before you join, the intro shows the browser's own city as before.
const WORLD_DELAY=260;
const WORLD={on:false,buf:[]};
function worldMsg(m){WORLD.buf.push({t:performance.now(),n:m.n,c:m.c,m:m.m,p:m.p});if(WORLD.buf.length>20)WORLD.buf.shift();}
// a car between snapshots a and n (k from 0 to 1) as [x, z, heading, speed]; a car turning back changes lane, so no sliding across
function worldCar(a,n,k,i){const j=i*4,ax=a.c[j],az=a.c[j+1],nx=n.c[j],nz=n.c[j+1],kk=Math.hypot(nx-ax,nz-az)>4?(k<0.5?0:1):k;
  return[lerp(ax,nx,kk),lerp(az,nz,kk),angLerp(a.c[j+2],n.c[j+2],kk),lerp(a.c[j+3],n.c[j+3],kk)];}
// the city at server tick s, from the snapshots this browser holds (tools/browser-test.js compares two players with it), or null
function worldAt(s){const b=WORLD.buf;
  for(let i=0;i+1<b.length;i++){const a=b[i],n=b[i+1];if(a.n>s||n.n<s)continue;const k=(s-a.n)/((n.n-a.n)||1);
    return{cars:TRAFFIC.slice(0,N_CARS).map((c,q)=>worldCar(a,n,k,q).slice(0,2)),peds:PEDS.map((p,q)=>[lerp(a.p[q*5],n.p[q*5],k),lerp(a.p[q*5+1],n.p[q*5+1],k)])};}
  return null;}
function netPed(p,vx,vz){const t=now();if(t-(p.sentAt||0)<600)return;p.sentAt=t;netSend({t:'ped',i:p.id,vx:r2(vx),vz:r2(vz)});}
function netProp(p){if(WORLD.on)netSend({t:'prop',i:p.i,fx:r2(p.fx),fz:r2(p.fz)});}
// another player's tank knocked a prop down (it falls the way they saw it fall), or it stands up again after a while
function propMsg(m){const p=PROPS[m.i];if(!p)return;
  if(m.up){const k=FALLING.indexOf(p);if(k>=0)FALLING.splice(k,1);p.state='up';p.th=0;p.w=0;p.bounced=false;p.apply(p);}
  else if(p.state==='up'){p.fx=m.fx;p.fz=m.fz;p.state='fall';p.th=0.001;p.w=p.w0;p.bounced=false;FALLING.push(p);}}
// props that were down already when you joined
function propsDown(list){for(const[i,fx,fz]of list||[]){const p=PROPS[i];if(!p)continue;p.fx=fx;p.fz=fz;p.state='down';p.th=p.th0;p.apply(p);}}
function worldUpdate(dt,tnow){
  for(const c of TRAFFIC)if(c.rival&&c.mode!=='wreck'&&!c.dyn)updateScript(c,dt);            // REDLINE stays parked in its yard
  const b=WORLD.buf;if(!b.length)return;
  const rt=tnow-WORLD_DELAY;while(b.length>2&&b[1].t<=rt)b.shift();
  const a=b[0],n=b[1]||a,k=n.t>a.t?Math.max(0,Math.min(1,(rt-a.t)/(n.t-a.t))):1;
  // cars: the first N_CARS of TRAFFIC, in the server's order, as x, z, heading, speed
  for(let i=0;i<N_CARS&&i*4<a.c.length;i++){const c=TRAFFIC[i],[x,z,h,v]=worldCar(a,n,k,i);
    c.x=x;c.z=z;c.hx=Math.sin(h);c.hz=Math.cos(h);c.v=v;
    c.g.position.set(c.x,0,c.z);c.g.rotation.y=h;c.g.userData.wheels.forEach(w=>w.rotation.x+=c.v*dt/0.34);}
  // the tram: its place along the track, which wraps around at the end of the loop
  const Lp=TRAM_PATH.len;let ds=n.m-a.m;if(ds<-Lp/2)ds+=Lp;else if(ds>Lp/2)ds-=Lp;TRAM.s=((a.m+ds*k)%Lp+Lp)%Lp;placeTram();
  // pedestrians as x, z, heading, tilt, fall direction
  if(a.p.length<PEDS.length*5)return;
  for(let i=0;i<PEDS.length;i++){const p=PEDS[i],j=i*5,jump=Math.hypot(n.p[j]-a.p[j],n.p[j+1]-a.p[j+1])>6,kk=jump?(k<0.5?0:1):k;   // jump: gone, and back elsewhere
    const x=lerp(a.p[j],n.p[j],kk),z=lerp(a.p[j+1],n.p[j+1],kk),d=Math.hypot(x-p.x,z-p.z);
    if(d<3)p.phase+=d*3.2;p.x=x;p.z=z;p.h=angLerp(a.p[j+2],n.p[j+2],kk);p.th=lerp(a.p[j+3],n.p[j+3],kk);
    const fa=(kk<0.5?a:n).p[j+4];p.fx=Math.sin(fa);p.fz=Math.cos(fa);p.state=p.th>0.001?'down':'walk';placePed(p);}
  pedDirty();}

// ---------- WORLD OF DODO: quality and the performance readout ----------
// The original always draws at up to 2× pixel ratio with 2048 px soft shadows: too much for a weak (integrated) GPU, where the whole
// picture stutters. The quality level drops by itself when the game keeps missing frames while driving (below Q_MIN_FPS for two
// seconds in a row, not in the first seconds after a change), never rises by itself, and is remembered in this browser. Q cycles the
// level by hand (auto then stops for this visit). F, a tap on the speed card or ?stats shows FPS, the slowest frame, ping and the level.
const Q_MIN_FPS=45,BASE_PR=Math.min(window.devicePixelRatio||1,COARSE?1.5:2);
const QUALITY=[
  {pr:BASE_PR,shadow:COARSE?1024:2048,snow:1},                   // high: the original
  {pr:Math.min(BASE_PR,1),shadow:1024,snow:1},                    // medium: 1 pixel per CSS pixel, smaller shadow map
  {pr:Math.min(BASE_PR,1)*0.75,shadow:0,snow:0.5}];               // low: three quarters of the resolution, no shadows, half the snow
const PERF={frames:0,ms:0,worst:0,fps:0,low:0,bad:0,wait:3,level:0,auto:true,ping:0,show:new URLSearchParams(location.search).has('stats')};
function setQuality(l){const q=QUALITY[l];PERF.level=l;
  renderer.setPixelRatio(q.pr);resize();
  moon.castShadow=q.shadow>0;                                                 // three.js rebuilds the shaders when the shadow count changes
  if(q.shadow&&moon.shadow.mapSize.x!==q.shadow){moon.shadow.mapSize.set(q.shadow,q.shadow);if(moon.shadow.map){moon.shadow.map.dispose();moon.shadow.map=null;}}
  snowN=Math.round(SN*q.snow);snowGeo.setDrawRange(0,snowN);
  try{localStorage.setItem('wod-quality',String(l));}catch(e){}
  renderStats();}
function initQuality(){let l=0;try{l=parseInt(localStorage.getItem('wod-quality'),10)||0;}catch(e){}
  if(l>0)setQuality(Math.min(l,QUALITY.length-1));else renderStats();}
// once per frame with the real frame time (ms); once a second: FPS, the readout, and maybe a step down
function perfTick(ms){PERF.frames++;PERF.ms+=ms;PERF.worst=Math.max(PERF.worst,ms);
  if(PERF.ms<1000)return;
  PERF.fps=Math.round(PERF.frames*1000/PERF.ms);PERF.low=Math.round(PERF.worst);PERF.frames=PERF.ms=PERF.worst=0;
  if(state==='drive'&&PERF.auto&&PERF.level<QUALITY.length-1){
    if(PERF.wait>0)PERF.wait--;
    else if(PERF.fps<Q_MIN_FPS){if(++PERF.bad>=2){PERF.bad=0;PERF.wait=3;setQuality(PERF.level+1);flash(T.qDown(T.qNames[PERF.level]));}}
    else PERF.bad=0;}
  renderStats();}
function renderStats(){const el=$('stats');el.hidden=!PERF.show;if(!PERF.show)return;el.textContent='';
  [PERF.fps+' FPS · max '+PERF.low+' ms',T.pingLbl+' '+(NET.live&&PERF.ping?Math.round(PERF.ping)+' ms':'–'),
   T.qLbl+': '+T.qNames[PERF.level]+' ('+(PERF.auto?T.qAuto:T.qManual)+(COARSE?'':' · Q')+')']
    .forEach(t=>{const s=document.createElement('span');s.textContent=t;el.appendChild(s);});}
addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.repeat)return;
  if(e.code==='KeyF'){PERF.show=!PERF.show;renderStats();}
  else if(e.code==='KeyQ'){PERF.auto=false;setQuality((PERF.level+1)%QUALITY.length);}});
document.querySelector('.gauge').addEventListener('click',()=>{PERF.show=!PERF.show;renderStats();});

// ---------- loop ----------
let last=performance.now(),orbit=0,paused=false;
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?72:55;camera.updateProjectionMatrix();sizeMini();}
addEventListener('resize',resize);

function frame(){
  requestAnimationFrame(frame);if(paused)return;
  const tnow=performance.now(),raw=tnow-last,dt=Math.min(0.05,raw/1000);last=tnow;
  if(state==='drive')updateDrive(dt);else if(state==='handover')updateHandover(dt);else if(state==='finale'&&F)updateFinale(dt);
  // shift clock: real time at CLOCK×, but never slower than the distance driven at city pace (V_CLOCK) — nobody can beat GAIA by speeding
  if(state==='drive'){realSec+=dt;gameSec+=Math.max(dt*CLOCK,lastMoved/V_CLOCK*CLOCK);lastMoved=0;}
  else if(state==='handover'){realSec+=dt;gameSec+=dt*H_GAME/HANDOVER_LEN;lastMoved=0;}
  if(WORLD.on)worldUpdate(dt,tnow);else{updateTraffic(dt);updatePeds(dt);}   // World of DODO: once you play, the city comes from the server
  updateShots(dt);updateProps(dt);
  car.gy+=(groundH(car.x,car.z)-car.gy)*Math.min(1,dt*14);van.position.set(car.x,car.gy+0.9*Math.abs(Math.sin(car.roll)),car.z);van.rotation.y=car.h;van.rotation.z=car.roll;
  van.visible=!(state==='drive'&&car.immT>0&&Math.floor(tnow/110)%2);                // World of DODO: blinks while immune after a (re)spawn
  van.userData.wheels.forEach(w=>w.rotation.x+=car.v*dt/0.46);
  van.userData.body.rotation.z=-car.steer*Math.min(1,Math.abs(car.v)/20)*0.05;

  // camera
  const k=1-Math.exp(-dt*4);
  if(state==='intro'||state==='results'||state==='plan'){orbit+=dt*0.05;const r=state==='results'?190:210;
    camera.position.lerp(new THREE.Vector3(Math.cos(orbit)*r,95,Math.sin(orbit)*r),Math.min(1,k*0.5));camLook.lerp(new THREE.Vector3(0,0,0),Math.min(1,k*0.5));}
  else if(state==='finale'&&F){if(F.phase==='land'){camera.position.lerp(new THREE.Vector3(Math.cos(orbit)*190,95,Math.sin(orbit)*190),k*0.5);camLook.lerp(new THREE.Vector3(0,0,0),k*0.5);}
    else if(F.phase==='drop'||F.phase==='after'){const Tg=F.target;camera.position.lerp(new THREE.Vector3(Tg.x+22,24,Tg.z+22),k*0.8);camLook.lerp(new THREE.Vector3(Tg.x,3,Tg.z),Math.min(1,k*2));}
    else{const fw=[Math.sin(F.h),Math.cos(F.h)];camera.position.lerp(new THREE.Vector3(bee.position.x-fw[0]*30,bee.position.y+26,bee.position.z-fw[1]*30),k*0.8);camLook.lerp(bee.position,Math.min(1,k*2));}}
  else if(state==='handover'){const s=H.s,n=s.n,sx=Math.cos(s.th),sz=-Math.sin(s.th);
    const tgt=new THREE.Vector3(s.door[0]+n[0]*13+sx*7,4.6,s.door[1]+n[1]*13+sz*7);camera.position.lerp(tgt,k*0.9);
    camLook.lerp(new THREE.Vector3(s.door[0]+n[0]*2.5,1.4,s.door[1]+n[1]*2.5),k);}
  else{const pt=camera.aspect<1,back=camMode?(pt?30:24):(pt?14:11.5),up=camMode?(pt?36:28):(pt?7.8:5.4),ah=pt?7:4,f=[Math.sin(car.h),Math.cos(car.h)];
    // World of DODO: a wall or a container between the tank and the camera pulls the camera in front of it (and a little higher)
    const cx=car.x-f[0]*back,cz=car.z-f[1]*back,hit=segHit(car.x,1.6,car.z,cx,up,cz),pull=hit<1?Math.max(0.2,hit-0.08):1;
    camera.position.lerp(new THREE.Vector3(car.x+(cx-car.x)*pull,1.6+(up-1.6)*pull+(1-pull)*3,car.z+(cz-car.z)*pull),hit<1?Math.min(1,k*3):k);
    camLook.lerp(new THREE.Vector3(car.x+f[0]*ah,1.2,car.z+f[1]*ah),Math.min(1,k*2));}
  camera.lookAt(camLook);

  // light follows the action
  const wide=state==='intro'||state==='results'||state==='plan'||(state==='finale'&&F&&F.phase==='land'),onBee=state==='finale'&&!wide;
  const fx=wide?0:onBee?bee.position.x:car.x,fz=wide?0:onBee?bee.position.z:car.z;
  moon.position.set(fx-50,110,fz+40);moon.target.position.set(fx,0,fz);
  if(wide){Object.assign(moon.shadow.camera,{left:-190,right:190,top:190,bottom:-190});}
  else Object.assign(moon.shadow.camera,{left:-80,right:80,top:80,bottom:-80});
  moon.shadow.camera.updateProjectionMatrix();

  // markers + snow
  const tt=tnow/1000;
  stops.forEach(s=>{if(!s.marker.visible)return;s.parcel.rotation.y=tt*1.2;s.parcel.position.y=4.4+Math.sin(tt*2+s.idx)*0.3;s.ring.scale.setScalar(1+Math.sin(tt*3+s.idx)*0.05);});
  const cx=camera.position.x,cz=camera.position.z;
  for(let i=0;i<snowN;i++){let y=snowPos[i*3+1]-dt*(2.2+(i%5)*0.35);if(y<0)y+=50;snowPos[i*3+1]=y;
    let x=snowPos[i*3]+Math.sin(tt*0.6+i)*dt*0.4,z=snowPos[i*3+2];
    if(x-cx>70)x-=140;else if(x-cx<-70)x+=140;if(z-cz>70)z-=140;else if(z-cz<-70)z+=140;snowPos[i*3]=x;snowPos[i*3+2]=z;}
  snowGeo.attributes.position.needsUpdate=true;
  if(CRANE_TOP)CRANE_TOP.rotation.y=tnow*0.00005;                                    // World of DODO: the crane turns slowly (a turn in about two minutes)

  netUpdate(dt,tnow);
  if(state==='drive'||state==='handover'){
    $('spd').textContent=Math.round(Math.abs(car.v)*2.2);
    drawMap(mctx,mini.width,{car,others:NET.others.values(),arena:true});
  }
  updateImpactFx(dt);
  let shx=0,shy=0;if(shakeT>0){shakeT-=dt;const a=Math.max(0,shakeT)*2.5;shx=(Math.random()-0.5)*a;shy=(Math.random()-0.5)*a;}
  camera.position.x+=shx;camera.position.y+=shy;renderer.render(scene,camera);camera.position.x-=shx;camera.position.y-=shy;
  perfTick(raw);
}

// World of DODO: the server said welcome, drive out from a free spot on the streets (the original went intro → plan → drive)

  state='drive';nameIn.blur();$('intro').hidden=true;$('mini').classList.remove('big');$('hud').hidden=false;$('touch').hidden=!coarse;sizeMini();last=performance.now();}
// the join form: a name and a tank colour, both remembered in this browser for the next time, nothing else
const nameIn=$('nameIn');let savedColor=NaN;

$('swatches').innerHTML=TANK_COLORS.map((c,i)=>'<label class="sw"><input type="radio" name="color" value="'+i+'"'+(c===NET.color?' checked':'')+'><span style="background:'+hexCss(c)+'"></span></label>').join('');

// automated tests (tools/browser-test.js) open the page with ?test and reach the game through this; nothing else uses it
if(new URLSearchParams(location.search).has('test'))window.WOD={car,NET,get state(){return state;},K,PERF,setQuality,renderer,scene,WORLD,TRAFFIC,PEDS,worldAt};

resize();initQuality();reset();frame();
const ready=()=>{const b=$('startBtn');b.disabled=false;$('startLbl').textContent=T.start;if(!COARSE)nameIn.focus();};
