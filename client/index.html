<!doctype html>
<!--
  World of DODO: the multiplayer arena built on Poslední míle (The Last Mile), DODO's Christmas 2026
  game, in a version where the delivery van had already become a tank. Served by server/server.js,
  which also relays the players and drives the bots. How it all fits together: README.md and
  docs/PROTOCOL.md.

  What changed against the original: no shift, no stops, no clock, no REDLINE hunt and no police.
  The player joins with a name and a tank colour; the other players and the server's bots drive in
  the same city with their names glowing above them; parcels hit other tanks (10 points for a
  player, 1 for a bot), three hits destroy a tank and it comes back somewhere else. A player may fly
  a plane (issue #14) or sail a warship on the Vltava (issue #20) instead. Changes against
  the original are marked "World of DODO" in the code.

  This file is the page around the 3D view: the HUD, the intro screen, the touch controls and their
  styles. The game itself is TypeScript on Babylon.js in client/src (entry: src/main.ts), built by
  Vite into client/dist; the original's three.js script and its single-player shift code are gone.
  Czech by default, English with ?lang=en.
-->

<style>
/* Layout: full-bleed 3D city; HUD pinned to the corners on solid charcoal cards; intro and results sit on the Hero scrim */
:root{
  --dodo-green:#27a28c; --dodo-dark-teal:#00746a; --dodo-charcoal:#3d4543; --dodo-light-teal:#b2dcd6;
  --dodo-peach:#f9aa8f; --dodo-white:#ffffff; --dodo-light-grey:#eaebeb; --dodo-grey:#adb1b0;
  --dodo-charcoal-80:#555c5a; --dodo-ink:#000000;
  --cta-bg:#f9aa8f; --cta-bg-hover:#f59a7b; --cta-bg-pressed:#ec8a6a;
  --gradient-hero-stops:#1e2322 11%, rgba(0,58,52,.72) 64%, rgba(0,58,52,0) 92%;
  --font-primary:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-secondary:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs-h1:56px; --fs-h2:40px; --fs-h3:28px; --fs-h4:22px; --fs-body-lg:18px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:12px; --fs-overline:11px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --radius-16:16px; --radius-pill:999px;
  --ease:cubic-bezier(0.2,0,0,1);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--dodo-ink);color:var(--dodo-white);font-family:var(--font-primary);font-size:var(--fs-body);overflow:hidden;font-feature-settings:"ss03" 1;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mono{font-family:var(--font-secondary);text-transform:uppercase;letter-spacing:.14em;font-size:var(--fs-overline);font-weight:600}
.meta{font-family:var(--font-secondary);text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-caption);font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"ss03" 1,"tnum" 1}
.card{background:var(--dodo-charcoal);border:1px solid var(--dodo-charcoal-80);border-radius:var(--radius-16)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
.tl{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:var(--space-3);width:240px}
.status{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.status img{height:20px;width:auto;align-self:flex-start}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-3)}
.clock{font-size:var(--fs-h3);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.status .mono{color:var(--dodo-light-teal)}
#stops{list-style:none;margin:0;padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
#stops li{display:flex;align-items:center;gap:var(--space-3);font-size:var(--fs-body-sm);color:var(--dodo-white)}
#stops li .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--dodo-green);color:var(--dodo-white);display:grid;place-items:center;font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:600}
#stops li.done{color:var(--dodo-grey)}
#stops li.done .n{background:transparent;border:1px solid var(--dodo-grey);color:var(--dodo-grey)}
#stops li.done .nm{text-decoration:line-through}
#stops li .t{margin-left:auto;color:var(--dodo-grey)}
.tr{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-3)}
#mini{display:block;width:176px;height:176px;border-radius:var(--radius-16);border:1px solid var(--dodo-charcoal-80);background:var(--dodo-charcoal)}
.camBtn{pointer-events:auto;display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-pill);border:1px solid var(--dodo-grey);background:var(--dodo-charcoal);color:var(--dodo-white);font:500 var(--fs-body-sm) var(--font-primary);cursor:pointer}
.camBtn:hover{border-color:var(--dodo-white)}
.camBtn:focus-visible,.cta:focus-visible,.tbtn:focus-visible{outline:2px solid var(--dodo-light-teal);outline-offset:2px}
.bc{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.gauge{display:flex;gap:var(--space-5);padding:var(--space-3) var(--space-5);align-items:baseline}
.gauge b{font-size:var(--fs-h4);font-weight:600;font-variant-numeric:tabular-nums}
.gauge span{color:var(--dodo-grey)}
#toast{padding:var(--space-3) var(--space-5);border-radius:var(--radius-pill);background:var(--dodo-white);color:var(--dodo-charcoal);font-size:var(--fs-body-sm);font-weight:600;white-space:nowrap;transition:opacity 220ms var(--ease),transform 220ms var(--ease)}
#toast.off{opacity:0;transform:translateY(8px)}
#pod{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:280px;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);transition:opacity 220ms var(--ease),transform 220ms var(--ease)}
#pod.off{opacity:0;transform:translateY(16px)}
#pod .ok{display:flex;align-items:center;gap:var(--space-2);color:var(--dodo-light-teal)}
#pod .ok svg{width:16px;height:16px}
#pod h4{margin:0;font-size:var(--fs-h4);font-weight:600;line-height:1.2}
#pod p{margin:0;font-size:var(--fs-body-sm);color:var(--dodo-light-grey)}
#sig{width:100%;height:72px;border-radius:var(--radius-16);background:var(--dodo-light-grey);display:block}
#pod .checks{display:flex;gap:var(--space-4);color:var(--dodo-grey)}
#pod .checks span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dodo-green);margin-right:6px;vertical-align:middle}

/* honey jars */
.jars-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.jars-row .meta{color:var(--dodo-light-grey);white-space:nowrap}
.jars{display:flex;gap:var(--space-2)}
.jar{width:20px;height:26px;display:block;overflow:visible}
.jar .honey{transform:translateY(19px);transition:transform 700ms var(--ease)}
.jar.full .honey{transform:translateY(0)}
.jar.pop{animation:pop 700ms var(--ease)}
@keyframes pop{0%{transform:translateY(0)}35%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.jars.big{gap:var(--space-3)}
.jars.big .jar{width:30px;height:39px}

/* finale */
#finale{position:fixed;inset:0;pointer-events:none}
#finale[hidden]{display:none!important}
.fin-card{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:var(--space-6);padding:var(--space-4) var(--space-5);max-width:calc(100% - 32px)}
.fin-text{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.fin-text .overline{color:var(--dodo-green)}
.fin-line{margin:0;font-size:var(--fs-body);font-weight:600}
.fin-km b{font-size:var(--fs-h3);font-weight:700;font-variant-numeric:tabular-nums}
.fin-km .meta{color:var(--dodo-grey)}
.skip{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:760px){.fin-card{gap:var(--space-4);width:calc(100% - 32px)}.fin-line{font-size:var(--fs-body-sm)}.jar{width:14px;height:18px}}

/* touch */
#touch{position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
#touch .grp{display:flex;gap:var(--space-3);pointer-events:auto}
.tbtn{width:64px;height:64px;border-radius:50%;border:1px solid var(--dodo-grey);background:var(--dodo-charcoal);color:var(--dodo-white);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
.tbtn svg{width:28px;height:28px}
.tbtn.on{background:var(--dodo-charcoal-80);border-color:var(--dodo-white)}
.tbtn.gas{background:var(--dodo-white);color:var(--dodo-charcoal);border-color:var(--dodo-white)}
.tbtn.gas.on{background:var(--dodo-light-grey)}
.tbtn.fire{position:absolute;right:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));pointer-events:auto;background:var(--dodo-green);border-color:var(--dodo-light-teal);color:var(--dodo-white)}
.tbtn.fire.on{background:var(--dodo-dark-teal)}

/* overlays */
.overlay{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(90deg,var(--gradient-hero-stops));display:flex;align-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) clamp(20px,4vw,48px) calc(48px + env(safe-area-inset-bottom,0px))}
.overlay[hidden]{display:none!important}
.intro-inner{max-width:560px;display:flex;flex-direction:column;gap:var(--space-5)}
.intro-inner img{height:32px;width:auto;align-self:flex-start}
.overline{font-family:var(--font-secondary);text-transform:uppercase;letter-spacing:.14em;font-size:var(--fs-overline);font-weight:600;color:var(--dodo-light-teal);margin:0}
h1{font-size:var(--fs-h1);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:var(--fs-h2);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:var(--fs-body-lg);font-weight:300;line-height:1.6;margin:0;color:var(--dodo-white);max-width:52ch}
.keys{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);color:var(--dodo-light-grey)}
.keys kbd{font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:500;border:1px solid var(--dodo-grey);border-radius:var(--radius-pill);padding:2px 8px;margin-right:6px;color:var(--dodo-white)}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--space-2);background:var(--cta-bg);color:var(--dodo-charcoal);border:0;border-radius:var(--radius-pill);padding:var(--space-3) var(--space-6);font:400 var(--fs-body) var(--font-primary);cursor:pointer;transition:background 120ms var(--ease)}
.cta:hover{background:var(--cta-bg-hover)}
.cta:active{background:var(--cta-bg-pressed);transform:translateY(1px)}
.cta svg{width:18px;height:18px}
.cta[disabled]{opacity:.6;cursor:progress}
.fine{color:var(--dodo-grey);font-size:var(--fs-caption);margin:0}

.res-inner{width:100%;max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:var(--space-7);align-items:center}
.res-text{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.kpi{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.kpi .v{font-size:var(--fs-h3);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.main{border-color:var(--dodo-green)}.kpi.main .v{color:var(--dodo-light-teal)}
.kpi .mono{color:var(--dodo-light-grey)}
.order{display:flex;flex-direction:column;gap:var(--space-2)}
.order .row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.order .lbl{width:96px;color:var(--dodo-light-grey)}
.dot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:600}
.dot.you{border:1px solid var(--dodo-light-teal);color:var(--dodo-light-teal)}
.dot.gaia{background:var(--dodo-green);color:var(--dodo-white)}
.mapwrap{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
#resmap{width:100%;aspect-ratio:1/1;max-width:100%;display:block;border-radius:var(--radius-16)}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;color:var(--dodo-light-grey)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.wish{font-size:var(--fs-body);line-height:1.6;margin:0;color:var(--dodo-white);max-width:56ch}

@media (max-width:760px){
  :root{--fs-h1:40px;--fs-h2:28px;--fs-h3:22px}
  .overlay{background:linear-gradient(0deg,var(--gradient-hero-stops));align-items:flex-end}
  #results.overlay{background:#1e2322;align-items:flex-start}
  .res-inner{grid-template-columns:minmax(0,1fr);gap:var(--space-5)}
  .tl{width:auto;right:calc(16px + 136px)}
  #stops{display:none}
  .status{padding:var(--space-3)}
  .clock{font-size:var(--fs-h4)}
  #mini{width:120px;height:120px}
  .tr .camBtn{padding:var(--space-1) var(--space-3)}
  .bc{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  #pod{left:16px;right:16px;width:auto;bottom:calc(180px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* time windows */
.status-top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}
.status-top img{height:20px;width:auto}
.wins{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.wins:empty{display:none}
.win{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:var(--radius-pill);background:var(--dodo-white);color:var(--dodo-charcoal);font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.win b{width:18px;height:18px;border-radius:50%;background:var(--dodo-green);color:var(--dodo-white);display:grid;place-items:center;font-weight:600}
.win.ok{background:transparent;color:var(--dodo-grey);border:1px solid var(--dodo-grey);text-decoration:line-through}
.win.ok b{background:var(--dodo-grey)}
.win.late b{background:#c0524a}
#stops li .t.w{color:var(--dodo-white)}
#stops li .t{white-space:nowrap}
#stops li .nm{min-width:0}
@media (min-width:761px){.tl{width:300px}}
p.keys{margin:0}

/* steering pad */
#touch{align-items:flex-end}
.steer{position:relative;width:min(184px,46vw);height:72px;border-radius:var(--radius-pill);border:1px solid var(--dodo-grey);background:var(--dodo-charcoal);touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
.steer .ar{position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;color:var(--dodo-grey)}
.steer .ar.l{left:12px}.steer .ar.r{right:12px}
.steer .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--dodo-white);transition:transform 120ms var(--ease)}
.steer.on .knob{transition:none}
.tbtn{width:72px;height:72px}

/* logos */
.logos{display:flex;align-items:center;gap:var(--space-3)}
.brand-row{display:flex;align-items:center;gap:var(--space-4)}
.brand-row img{height:32px;width:auto}
/* plan screen */
.start-time{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-5);align-self:flex-start;border-color:var(--dodo-green)}
.start-time svg{width:40px;height:40px;flex:none;color:var(--dodo-green)}
.st-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-txt .mono{color:var(--dodo-light-teal)}
.st-txt b{font-size:var(--fs-h2);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st-txt small{font-size:var(--fs-caption);color:var(--dodo-light-grey)}
.plan-inner{width:100%;max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);grid-template-areas:"head map" "side map";gap:var(--space-5) var(--space-7);align-items:start}
.plan-head{grid-area:head;display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.plan-map{grid-area:map}
.plan-side{grid-area:side;display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
#planmap{width:100%;aspect-ratio:1/1;max-width:100%;display:block;border-radius:var(--radius-16)}
.legend i.dep{width:12px;height:12px;border-radius:50%;background:var(--dodo-light-teal)}
.legend i.slot{width:20px;height:10px;border-radius:var(--radius-pill);background:var(--dodo-white)}
.plan-list{list-style:none;margin:0;padding:var(--space-3) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.plan-list li{display:flex;align-items:center;gap:var(--space-3);min-width:0}
.plan-list .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--dodo-green);color:var(--dodo-white);display:grid;place-items:center;font-family:var(--font-secondary);font-size:var(--fs-caption);font-weight:600}
.plan-list .nm{display:flex;flex-direction:column;min-width:0;font-size:var(--fs-body-sm);font-weight:600}
.plan-list .nm small{font-weight:400;color:var(--dodo-light-grey);font-size:var(--fs-caption)}
.plan-list .win{margin-left:auto;padding:2px 10px}
#mini{pointer-events:auto;cursor:pointer}
#mini.big{width:min(340px,calc(100vw - 32px));height:min(340px,calc(100vw - 32px))}
@media (max-width:760px){
  #plan.overlay{background:#1e2322;align-items:flex-start}
  .plan-inner{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "map" "side";gap:var(--space-4)}
  .plan-head{gap:var(--space-3)}
  .plan-head .lead{font-size:var(--fs-body)}
  #goBtn{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));align-self:stretch;justify-content:center}
}

/* mobile-first overrides */
html,body{overscroll-behavior:none}
body{touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.overlay{touch-action:pan-y}
#hud,#touch,#finale{user-select:none;-webkit-user-select:none}
@media (max-width:760px),(pointer:coarse) and (max-width:1024px){

.tb-mon{display:flex;align-items:center;gap:8px}
.tb-mn{font:600 var(--fs-caption)/1 var(--font-secondary);letter-spacing:.08em;text-transform:uppercase;color:var(--mon)}
.tb-mhp{position:relative;flex:1;min-width:40px;height:6px;border-radius:3px;background:var(--dodo-charcoal-80);overflow:hidden}
.tb-mhp i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#ff7a59,#f2c94c);transition:width 300ms var(--ease)}
.tb-md{display:flex;gap:3px;align-items:baseline;color:var(--dodo-grey)}
.tb-md b{font-weight:600;font-variant-numeric:tabular-nums}
.tb-md .a{color:var(--team0)}.tb-md .b{color:var(--team1)}
.tb-mon.lead0 .tb-md .a,.tb-mon.lead1 .tb-md .b{text-decoration:underline;text-underline-offset:3px}
.tb-mt{color:var(--dodo-light-grey);min-width:30px;text-align:right}
.tb-mon.gone{opacity:.6}
.monres{position:fixed;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-4) var(--space-5);width:min(340px,calc(100vw - 32px));box-sizing:border-box;text-align:center;pointer-events:none;background:rgba(30,35,34,.94);border-color:var(--mon)}
.monres .overline{color:var(--mon)}
.monres h3{margin:0;font-size:var(--fs-h4);font-weight:700}
.monres p{margin:0}
.mr-win{font-weight:600;color:var(--wc,var(--dodo-white))}
.mr-sc{display:flex;gap:8px;align-items:baseline;font-size:var(--fs-h4);font-weight:700;font-variant-numeric:tabular-nums}
.mr-sc .meta{color:var(--dodo-grey)}
#mrA{color:var(--team0)}#mrB{color:var(--team1)}
.mr-top{color:var(--dodo-light-grey);text-transform:none;letter-spacing:.02em}
@media (max-width:760px),(pointer:coarse) and (max-width:1024px){
  .tb-mon{gap:6px}
  body:has(#tbMon:not([hidden])) .tl,body:has(#tbMon:not([hidden])) .tr{top:calc(16px + 76px + 8px + 18px + env(safe-area-inset-top,0px))}
  .monres{top:34%}
}
</style>

<canvas id="gl" data-ta="glAria"></canvas>
<div class="montag" id="monTag" hidden aria-hidden="true"><span data-t="monName"></span><i><b id="monTagHp"></b></i></div>
<div class="ret" id="aimC" hidden></div><div class="ret x" id="gunX" hidden></div>
<div class="scope" id="scope" hidden></div><div class="tmark" id="tm0" hidden></div><div class="tmark" id="tm1" hidden></div><div class="shipx" id="shipX" hidden><span id="shipT"></span></div>

<div id="hud" hidden>
  <!-- World of DODO, issue #24: the team bar (the scores, the round's clock, the zones), filled by ui/teamhud.ts -->
  <div class="card teambar" id="teamBar" role="group" data-ta="tbAria" hidden>
    <div class="tb-top">
      <span class="tb-sc" id="tbS0"><i class="tb-sw"></i><span class="tb-nm" id="tbN0">A</span><b id="tbP0">0</b></span>
      <span class="tb-clock meta" id="tbClock">15:00</span>
      <span class="tb-sc r" id="tbS1"><b id="tbP1">0</b><span class="tb-nm" id="tbN1">B</span><i class="tb-sw"></i></span>
    </div>
    <div class="tb-bar"><i id="tbB0"></i><i id="tbB1"></i></div>
    <div class="zones" id="zones"></div>
    <!-- issue #26: Velemlok while it is in the water: its hit points, the damage of A : B, the time until it swims off (ui/monhud.ts) -->
    <div class="tb-mon" id="tbMon" hidden><span class="tb-mn" data-t="monName"></span><span class="tb-mhp"><i id="tbMonHp"></i></span><span class="tb-md meta"><b class="a" id="tbMonA">0</b><span>:</span><b class="b" id="tbMonB">0</b></span><span class="meta tb-mt" id="tbMonT"></span></div>
  </div>
  <div class="tl">
    <div class="card status">
      <div class="status-top"><span class="logos"><img id="hudLogo" alt="DODO"></span><span class="meta" id="online"></span></div>
      <div class="board-head"><span class="mono" data-t="boardLbl"></span><span class="meta" data-t="boardCol"></span></div>
      <ol class="board" id="board" aria-live="off"></ol>
      <div class="wanted" id="wanted" hidden><div class="stars" id="stars"></div><div class="bar"><i id="wbar"></i></div><div class="bar c" id="cbarWrap" hidden><i id="cbar"></i></div></div>
    </div>
  </div>
  <div class="tr">
    <canvas id="mini" width="176" height="176" data-ta="mapAria"></canvas>
    <button class="camBtn" id="camBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      <span data-t="camera"></span>
    </button>
    <button class="camBtn" id="vehBtn" type="button" data-ta="vehAria">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>
      <span id="vehLbl"></span>
    </button>
    <button class="camBtn" id="menuBtn" type="button" data-ta="menuAria"><!-- World of DODO, issue #22: back to the start screen (Esc) -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      <span data-t="menu"></span>
    </button>
    <div class="card stats meta" id="stats" hidden></div>
    <p class="attr" data-t="attrib"></p>
  </div>
  <div class="bc">
    <div class="card pick" id="pick" hidden><span class="meta" data-t="pickLbl"></span><button class="camBtn" type="button" data-v="0">1 · <span data-t="vehTank"></span></button><button class="camBtn" type="button" data-v="1">2 · <span data-t="vehPlane"></span></button><button class="camBtn" type="button" data-v="2">3 · <span data-t="vehShip"></span></button></div>
    <div class="card cap" id="cap" hidden><span class="cap-hd"><b id="capNm"></b><span class="meta" id="capSt"></span></span><span class="cap-bar"><i id="capFill"></i></span></div><!-- issue #24: the zone you stand in -->
    <div id="toast" class="off"></div>
    <div class="card sea" id="sea" hidden>
      <div class="grp"><span class="meta lbl" data-t="telLbl"></span><div class="tel"><span id="tel0"></span><span id="tel1"></span><span id="tel2"></span><span id="tel3"></span><span id="tel4"></span></div></div>
      <div class="grp"><span class="meta lbl" data-t="rudLbl"></span><div class="rudder"><i id="rud"></i></div></div>
      <div class="grp"><span class="chip" id="tur0"><b>1</b><span id="turS0"></span></span><span class="chip" id="tur1"><b>2</b><span id="turS1"></span></span><span class="chip" id="torp"><b>T</b><span id="torpS"></span></span></div>
      <div class="grp"><span class="chip mon" id="seaMon" hidden><b><svg viewBox="0 0 24 14" aria-hidden="true"><g fill="currentColor"><ellipse cx="18.6" cy="7" rx="3.6" ry="3.1"/><ellipse cx="12" cy="7" rx="5.4" ry="2.5"/><path d="M7.4 6C5 5.8 3.2 4.2.6 5c2.2.7 3.6 2.9 6.8 2.9z"/></g><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M15.3 5.2l1.4-3M15.3 8.8l1.4 3M9.2 5.2 7.6 2.4M9.2 8.8l-1.6 2.8M16.4 4.2l-1.3-1.7M16.4 9.8l-1.3 1.7"/></g></svg></b><span id="seaMonT"></span></span></div><!-- issue #26: Velemlok's countdown -->
    </div>
    <div class="card gauge">
      <div><b id="spd">0</b> <span class="meta" id="spdU" data-t="speedUnit"></span></div>
      <div class="air" hidden><b id="alt">0</b> <span class="meta">m</span></div>
      <div class="air" hidden><b id="thr">0</b> <span class="meta" data-t="thrUnit"></span></div>
      <div class="air" hidden><b id="bombs">0</b> <span class="meta" data-t="bombsUnit"></span></div>
      <div><b id="myPts">0</b> <span class="meta" data-t="ptsUnit"></span></div>
    </div>
  </div>
</div>

<!-- World of DODO, issue #24: the end of a round: the winner and the best players, until the next round starts -->
<div class="card rend" id="roundEnd" hidden aria-live="polite">
  <p class="overline" data-t="roundOver"></p>
  <h2 id="reWin"></h2>
  <p class="re-you" id="reYou"></p>
  <p class="re-sc"><span id="reA"></span><span class="meta">:</span><span id="reB"></span></p>
  <p class="mono re-lbl" data-t="roundBest"></p>
  <ol class="re-best" id="reBest"></ol>
  <p class="meta re-next" id="reNext"></p>
</div>

<!-- World of DODO, issue #26: Velemlok has left: killed or fled, the winning team and its bonus, the damage A : B, who hurt it most -->
<div class="card monres" id="monRes" hidden aria-live="polite">
  <p class="overline" data-t="monName"></p>
  <h3 id="mrHead"></h3>
  <p class="mr-win" id="mrWin"></p>
  <p class="mr-sc"><span class="meta">A</span><b id="mrA"></b><span class="meta">:</span><b id="mrB"></b><span class="meta">B</span></p>
  <p class="meta mr-top" id="mrTop"></p>
</div>

<div id="touch" hidden>
  <div class="steer" id="steer" data-ta="steerAria">
    <svg class="ar l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    <svg class="ar r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    <div class="knob" id="knob"></div>
  </div>
  <div class="grp">
    <button class="tbtn" data-k="down" type="button" data-ta="brakeAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="tbtn gas" data-k="up" type="button" data-ta="gasAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
    <button class="tbtn alt" data-k="alt" type="button" data-ta="altAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="tbtn fire" data-k="fire" type="button" data-ta="fireAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></button>
  </div>
</div>

<section class="overlay" id="intro">
  <div class="intro-inner">
    <div class="brand-row"><img id="introLogo" alt="DODO"></div>
    <p class="overline" data-t="introOver"></p>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="introLead"></p>
    <div class="keys meta" id="keysDesk">
      <span><kbd>↑ ↓ ← →</kbd><span data-t="kSteer"></span></span>
      <span><kbd data-t="kSpace"></kbd><span data-t="kBrake"></span></span>
      <span><kbd>E</kbd><span data-t="kAlt"></span></span>
      <span><kbd>V</kbd><span data-t="kVeh"></span></span>
      <span><kbd data-t="kMouse"></kbd><span data-t="kAim"></span></span>
      <span><kbd>W S</kbd><span data-t="kThr"></span></span>
      <span><kbd>Q</kbd><span data-t="kTorp"></span></span>
      <span><kbd>Shift</kbd><span data-t="kZoom"></span></span>
      <span><kbd>C</kbd><span data-t="kCam"></span></span>
      <span><kbd>F</kbd><span data-t="kStats"></span></span>
    </div>
    <p class="keys meta" id="keysTouch" hidden data-t="keysTouch"></p>
    <form class="join" id="joinForm" novalidate>
      <label class="mono" for="nameIn" data-t="nameLbl"></label>
      <input id="nameIn" name="name" type="text" maxlength="16" autocomplete="nickname" autocapitalize="words" spellcheck="false" enterkeyhint="go" data-tp="namePh">
      <fieldset class="swatches"><legend class="mono" data-t="colorLbl"></legend><div class="sw-row" id="swatches"></div></fieldset>
      <fieldset class="vehs"><legend class="mono" data-t="vehLbl"></legend><div class="veh-row"><label class="veh"><input type="radio" name="veh" value="0" checked><span data-t="vehTank"></span></label><label class="veh"><input type="radio" name="veh" value="1"><span data-t="vehPlane"></span></label><label class="veh"><input type="radio" name="veh" value="2"><span data-t="vehShip"></span></label></div></fieldset>
      <fieldset class="vehs teams"><legend class="mono" data-t="teamLbl"></legend><div class="veh-row"><label class="veh"><input type="radio" name="team" value="auto" checked><span data-t="teamAuto"></span></label><label class="veh"><input type="radio" name="team" value="0"><span><i class="tdot t0"></i>A</span></label><label class="veh"><input type="radio" name="team" value="1"><span><i class="tdot t1"></i>B</span></label></div></fieldset>
      <button class="cta" id="startBtn" type="submit" disabled><span id="startLbl" data-t="loading"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      <p class="err" id="joinErr" role="alert" hidden></p>
    </form>
    <p class="fine" data-t="introFine"></p>
    <p class="fine src" data-t="mapSrc"></p>
    <p class="fine"><a class="report" href="https://github.com/Rajcze33/world-of-dodo/issues/new/choose" target="_blank" rel="noopener" data-t="reportLink"></a></p>
  </div>
</section>

<script type="module" src="/src/main.ts"></script>

</body></html>
